<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; media-src file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>CS2 DemoLab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="theme-art" aria-hidden="true"></div>
  <header class="topbar">
    <button class="brand" data-view="overview" title="Overview">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M9.5 3h5M10.5 3v5.5L5 18.2A1.9 1.9 0 0 0 6.7 21h10.6a1.9 1.9 0 0 0 1.7-2.8L13.5 8.5V3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M7.6 15.5h8.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-name">Demo<b>Lab</b></span>
    </button>
    <nav class="topnav">
      <button class="nav-btn active" data-view="overview">Overview</button>
      <button class="nav-btn" data-view="matches">Matches<span class="nav-count" id="matchCount"></span></button>
      <button class="nav-btn" data-view="maps">Maps</button>
      <button class="nav-btn" data-view="utility">Utility<span class="nav-count" id="utilCount"></span></button>
      <button class="nav-btn" data-view="clips">Clips<span class="nav-count" id="clipCount"></span></button>
      <button class="nav-btn" data-view="downloads">Downloads<span class="nav-count" id="dlCount"></span></button>
    </nav>
    <div class="psearch" id="playerSearch">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="playerSearchInput" type="search" placeholder="Search players…" autocomplete="off" spellcheck="false" title="Any player from your demos, by name, SteamID64 or profile link (Ctrl+K)">
      <div class="psearch-list hidden" id="playerSearchList"></div>
    </div>
    <div class="spacer"></div>
    <div class="status" id="status"></div>
    <div class="me-wrap">
      <div class="me-card" id="meCard" title="Your stats, theme and settings"></div>
      <div class="me-menu hidden" id="meMenu"></div>
    </div>
  </header>

  <main>
    <section class="view active" id="view-overview"></section>

    <section class="view" id="view-matches">
      <div class="demo-list">
        <div class="list-head">
          <input id="demoSearch" type="search" placeholder="Search matches or maps…">
          <button class="icon-btn" id="refreshDemos" title="Rescan demo folders">
            <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          </button>
        </div>
        <div class="list-sub" id="demoListSub"></div>
        <div class="demos" id="demos"></div>
      </div>
      <div class="detail" id="detail"></div>
    </section>

    <section class="view" id="view-maps"></section>
    <section class="view" id="view-utility"></section>
    <section class="view" id="view-clips"></section>
    <section class="view" id="view-downloads"></section>
    <section class="view" id="view-themes"></section>
    <section class="view" id="view-settings"></section>
  </main>

  <div class="overlay hidden" id="overlay"></div>
  <div class="toasts" id="toasts"></div>
  <script src="scene.js"></script>
  <script src="app.js"></script>
  <script src="insights.js"></script>
  <script src="weapons.js"></script>
</body>
</html>
