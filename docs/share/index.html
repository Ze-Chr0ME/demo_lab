<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS2 highlights</title>
<meta name="description" content="CS2 highlights and stats, recorded from demos with CS2 DemoLab.">
<meta property="og:type" content="website">
<meta property="og:title" content="CS2 highlights">
<meta property="og:description" content="Watch my best CS2 plays and see my stats, made with CS2 DemoLab.">
<meta property="og:image" content="https://ze-chr0me.github.io/demo_lab/share/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b0f13">
<meta name="referrer" content="strict-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0f13'/%3E%3Cpath d='M12 9.5v13l10.5-6.5z' fill='%232fd8a4'/%3E%3C/svg%3E">
<!--
  The page of a "My highlights" link made by CS2 DemoLab (src/lib/gallery.js). Everything it shows comes
  from the link: after the # is the gallery, deflate-raw + base64url JSON: clips, the app theme and a
  snapshot of the Overview. Videos and thumbnails are on qu.ax (older ones on catbox), pictures on
  files.catbox.moe. qu.ax only plays its files on pages that send a Referer, hence the strict-origin referrer
  (just https://ze-chr0me.github.io/, never the # part). Only qu.ax/catbox file names, a Steam
  ID, a Steam avatar hash, colours and numbers are taken from the link, never whole URLs, so a link can't
  make this page show or point to anything else.
  Looks like the app: the backdrop is a trimmed port of src/renderer/scene.js, the cards use the
  Overview's styles (src/renderer/styles.css).
-->
<style>
  :root {
    --base: #0b0f13;
    --accent: #2fd8a4;
    --accent-ink: #03140d;
    --text: #e8edf2;
    --blue: var(--accent);
    --glow: var(--accent);
    --bg: var(--base);
    --bg-2: color-mix(in oklab, var(--base), #fff 2.5%);
    --panel: color-mix(in oklab, var(--base), #fff 4.5%);
    --panel-2: color-mix(in oklab, var(--base), #fff 7.5%);
    --panel-3: color-mix(in oklab, var(--base), #fff 11%);
    --line: color-mix(in oklab, var(--base), #fff 10%);
    --line-2: color-mix(in oklab, var(--base), #fff 17%);
    --line-soft: color-mix(in oklab, var(--base), #fff 7%);
    --track: color-mix(in oklab, var(--base), #fff 10%);
    --muted: color-mix(in oklab, var(--text) 60%, var(--base));
    --dim: color-mix(in oklab, var(--text) 38%, var(--base));
    --accent-2: color-mix(in oklab, var(--accent), #fff 22%);
    --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent);
    --blue-2: color-mix(in oklab, var(--blue), #fff 22%);
    --win: #45d483;
    --loss: #ff4d63;
    --warn: #f5c344;
    --ct: #6ea8ff;
    --t: #e9b949;
    --radius: 10px;
    --gutter: 32px;
    --card-bg: var(--panel);
    --label: 600 11px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  :root[data-scene=map] { --card-bg: color-mix(in srgb, var(--panel) 74%, transparent); }
  :root[data-scene=team] { --card-bg: color-mix(in srgb, var(--panel) 80%, transparent); }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  svg { flex: none; }
  .spacer { flex: 1; }
  .good { color: var(--win); } .bad { color: var(--loss); } .mid { color: var(--warn); }

  /* ---------- backdrop (scene.js) ---------- */
  .theme-art { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; --p: 0; }
  .theme-art > * { position: absolute; }
  .theme-art [hidden] { display: none; }
  .sc-photo { inset: 0 0 -22% 0; transform-origin: 50% 0; opacity: 0; transition: opacity .7s ease; will-change: transform; }
  .sc-photo.ready { opacity: 1; }
  .sc-img { position: absolute; inset: 0; background: center 35% / cover no-repeat; }
  .sc-img.soft { inset: -40px; filter: blur(18px) saturate(.85); opacity: 0; }
  .sc-pattern-wrap { inset: 0; opacity: .55; -webkit-mask-image: radial-gradient(75% 80% at 76% 26%, #000 0%, #0009 42%, transparent 82%); mask-image: radial-gradient(75% 80% at 76% 26%, #000 0%, #0009 42%, transparent 82%); }
  [data-kind=pattern] .sc-pattern-wrap { opacity: .4; }
  .sc-pattern { position: absolute; left: 0; right: 0; top: 0; bottom: calc(-1 * var(--tile-h, 0px)); opacity: .5; will-change: transform; }
  .sc-glow { border-radius: 50%; will-change: transform; }
  .sc-glow.a { width: 1300px; height: 820px; right: -260px; top: -300px; background: radial-gradient(closest-side, color-mix(in srgb, var(--glow) 15%, transparent), transparent); }
  .sc-glow.b { width: 1000px; height: 1000px; left: -380px; bottom: -520px; background: radial-gradient(closest-side, color-mix(in srgb, var(--blue) 8%, transparent), transparent); }
  [data-kind=map] .sc-glow.a { opacity: .45; }
  .sc-logo { width: var(--size, 600px); height: var(--size, 600px); right: max(3vw, 24px); top: calc(20px + 5vh); transform-origin: 50% 50%; will-change: transform; }
  .sc-logo[data-look=lit] { opacity: .78; }
  .sc-logo img { width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 1.2s ease; }
  .sc-logo img.ready { opacity: .5; animation: sc-flicker 11s 2s infinite; }
  @keyframes sc-flicker { 0%, 88%, 89.6%, 91.4%, 100% { opacity: .5; } 88.8% { opacity: .3; } 90.5% { opacity: .38; } 91% { opacity: .28; } }
  .sc-shade { inset: 0; }
  .sc-shade::after { content: ""; position: absolute; inset: 0; background: var(--base); opacity: 0; }
  [data-kind=map] .sc-shade { background:
    linear-gradient(180deg, color-mix(in srgb, var(--base) 64%, transparent) 0%, color-mix(in srgb, var(--base) 48%, transparent) 30%, color-mix(in srgb, var(--base) 70%, transparent) 70%, color-mix(in srgb, var(--base) 92%, transparent) 100%),
    linear-gradient(90deg, color-mix(in srgb, var(--base) 35%, transparent), transparent 60%); }
  [data-kind=map] .sc-shade::after { opacity: calc(var(--p) * .42); }
  [data-kind=team] .sc-shade { background: radial-gradient(130% 100% at 72% 28%, transparent 35%, color-mix(in srgb, var(--base) 75%, transparent) 100%); }
  .sc-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
  :root:is([data-scene=map], [data-scene=team]) :is(.dcard, .tile, .score-panel, .clip, .toolbar-card) { backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2); }
  :root[data-scene=map] :is(.dash-head, .sec) { text-shadow: 0 1px 3px var(--base), 0 0 14px color-mix(in srgb, var(--base) 80%, transparent); }

  /* ---------- page ---------- */
  .page { position: relative; z-index: 1; container-type: inline-size; max-width: 1600px; margin: 0 auto; padding: 30px var(--gutter) 60px; }
  .dash-head { display: flex; align-items: center; gap: 18px; margin-bottom: 26px; flex-wrap: wrap; }
  .avatar { width: 76px; height: 76px; border-radius: 14px; flex: none; display: grid; place-items: center; overflow: hidden;
    font: 800 32px var(--display); color: var(--accent-ink); background: var(--accent); box-shadow: 0 0 0 1px #ffffff14, 0 10px 30px -10px #000; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dash-title { min-width: 0; }
  .kicker { font: var(--label); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
  .dash-title h1 { margin: 2px 0 0; font: 700 32px/1.15 var(--display); letter-spacing: -.5px; overflow-wrap: anywhere; }
  .dash-title .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .head-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel-2);
    cursor: pointer; text-decoration: none; font-size: 13px; font-weight: 600; white-space: nowrap; transition: border-color .15s, background .15s; }
  .btn:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line-2)); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn.primary:hover { background: var(--accent-2); }
  .btn svg { width: 16px; height: 16px; }

  .sec { display: flex; align-items: center; gap: 14px; margin: 0 0 14px; min-height: 30px; flex-wrap: wrap; }
  .sec h3 { margin: 0; font: var(--label); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .sec::after { content: ""; flex: 1; height: 1px; background: var(--line); order: 1; min-width: 20px; }
  .sec > :not(h3) { order: 2; }
  .ov-sec { margin-top: 36px; }
  .dash { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: stretch; }
  .dcard { background: var(--card-bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; min-width: 0; display: flex; flex-direction: column; }
  .dcard.span-2 { grid-column: span 2; } .dcard.span-3 { grid-column: span 3; }
  .dcard-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; min-height: 20px; }
  .dcard-head h4 { margin: 0; font: var(--label); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .hint { font-size: 12px; color: var(--dim); }

  /* rating panel + tiles */
  .ov-top { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 22px; align-items: stretch; }
  .ov-stats { display: flex; flex-direction: column; min-width: 0; }
  .score-panel { border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 22px 20px; display: flex; flex-direction: column;
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 13%, var(--card-bg)) 0%, var(--card-bg) 46%); position: relative; overflow: hidden; }
  .score-panel::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--accent); opacity: .8; }
  .sp-k { font: var(--label); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); text-align: center; }
  .sp-v { font: 700 76px/1 var(--display); letter-spacing: -2px; text-align: center; margin: 12px 0 10px; color: var(--accent); font-variant-numeric: tabular-nums;
    text-shadow: 0 0 40px color-mix(in srgb, var(--accent) 35%, transparent); }
  .sp-level { align-self: center; font: var(--label); letter-spacing: .14em; text-transform: uppercase; padding: 5px 12px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-2); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
  .sp-bar { margin: 18px 0 0; height: 5px; }
  .sp-bar .bar-fill { background: var(--accent); }
  .sp-trend { font-size: 12px; color: var(--muted); text-align: center; margin-top: 10px; }
  .sp-trend.up { color: var(--win); } .sp-trend.down { color: var(--loss); }
  .sp-label { font: var(--label); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 24px 0 10px; }
  .sp-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .sp-row-top { display: flex; align-items: center; gap: 9px; font-size: 13.5px; }
  .sp-row-top b { font-variant-numeric: tabular-nums; font-weight: 700; }
  .sp-row .bar-track { height: 3px; }
  .sp-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
  .sp-dot.good, .sp-row .bar-fill.good { background: var(--accent); }
  .sp-row b.good { color: var(--accent); }
  .sp-dot.mid, .sp-row .bar-fill.mid { background: var(--warn); }
  .sp-dot.bad, .sp-row .bar-fill.bad { background: var(--loss); }
  .form { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
  .form-m { height: 26px; border-radius: 5px; border: 1px solid var(--line); background: var(--bg-2); color: var(--muted); font-size: 11px; font-weight: 800; display: grid; place-items: center; }
  .form-m.r-W { background: #45d4831c; border-color: #45d48355; color: var(--win); }
  .form-m.r-L { background: #ff4d6318; border-color: #ff4d6350; color: var(--loss); }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 12px; flex: 1; }
  .tile { background: var(--card-bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 12px; min-width: 0; display: flex; flex-direction: column; gap: 6px; transition: border-color .15s; }
  .tile-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .tile-chart { flex: 1; min-height: 34px; max-height: 70px; position: relative; margin-top: 4px; }
  .tile-chart svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .histo { overflow: visible; }
  .histo rect { fill: color-mix(in srgb, var(--accent) 45%, transparent); }
  .histo rect.on { fill: var(--accent); }
  .histo .base { stroke: var(--line-2); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .histo .avg, .histo .rec { stroke: var(--text); vector-effect: non-scaling-stroke; stroke-width: 1.5; }
  .histo .avg { stroke-dasharray: 3 2; opacity: .7; }
  .legend-inline { display: inline-flex; align-items: center; gap: 6px; }
  .legend-inline i { display: inline-block; width: 0; height: 12px; border-left: 2px dashed var(--text); margin-left: 8px; opacity: .7; }
  .legend-inline .lg-rec { border-left-style: solid; opacity: 1; }
  .tile:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .tile-k { font: var(--label); letter-spacing: .13em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile-v { font: 700 32px/1 var(--display); letter-spacing: -.8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tile-v small, .big small { font-size: .5em; font-weight: 600; margin-left: 3px; letter-spacing: 0; color: var(--muted); }
  .tile-sub { font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tile-sub b { font-weight: 400; }
  .tile-sub.up b { color: var(--win); } .tile-sub.down b { color: var(--loss); }

  /* bars, numbers */
  .bars { display: flex; flex-direction: column; gap: 11px; }
  .bar-row { display: flex; flex-direction: column; gap: 6px; }
  .bar-top { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .bar-label { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-top b { font-variant-numeric: tabular-nums; min-width: 38px; text-align: right; }
  .bar-note { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar-track { height: 4px; background: var(--track); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--blue); border-radius: 3px; }
  .bar-fill.good { background: var(--win); } .bar-fill.bad { background: var(--loss); } .bar-fill.mid { background: var(--warn); }
  .bar-fill.t { background: var(--t); } .bar-fill.ct { background: var(--ct); }
  .big-line { display: flex; align-items: baseline; gap: 10px; margin: 0 0 16px; flex-wrap: wrap; }
  .big { font: 700 34px/1 var(--display); letter-spacing: -.8px; font-variant-numeric: tabular-nums; }
  .big-note { color: var(--muted); font-size: 12.5px; }
  .kv { display: flex; flex-direction: column; margin-top: auto; }
  .kv-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line-soft); font-size: 13px; }
  .kv-row span { color: var(--muted); }
  .kv-row b { font-variant-numeric: tabular-nums; font-weight: 650; }
  .multi { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
  .multi-c { text-align: center; padding: 8px 4px; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--line-soft); }
  .multi-c .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .multi-c .k { font: var(--label); color: var(--muted); letter-spacing: .08em; }
  .multi-c.m4 .v { color: var(--accent-2); } .multi-c.m5 .v { color: #c9a6ff; }
  .map-thumb { width: 34px; height: 34px; border-radius: 7px; flex: none; position: relative; overflow: hidden;
    background: linear-gradient(135deg, var(--c), var(--panel-2)) center / cover no-repeat; box-shadow: inset 0 0 0 1px #ffffff14; }
  .map-thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, color-mix(in srgb, var(--c) 45%, transparent), color-mix(in srgb, var(--bg) 73%, transparent)); }
  .map-rows { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 28px; }
  .map-row { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
  .map-row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .trend-wrap svg { width: 100%; height: auto; display: block; }
  .trend-svg .g { stroke: var(--line-soft); stroke-width: 1; }
  .trend-svg .g-one { stroke: var(--line-2); stroke-width: 1; stroke-dasharray: 4 4; }
  .trend-svg .g-t { fill: var(--dim); font-size: 11px; text-anchor: end; font-family: "Segoe UI", system-ui, sans-serif; }
  .trend-svg .t-stop-a { stop-color: var(--accent); stop-opacity: .18; }
  .trend-svg .t-stop-b { stop-color: var(--accent); stop-opacity: 0; }
  .trend-svg .t-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  .trend-svg .t-avg { fill: none; stroke: var(--text); stroke-width: 1.5; stroke-dasharray: 5 4; opacity: .5; }
  .trend-svg .t-pt { stroke: var(--panel); stroke-width: 2; fill: var(--dim); }
  .trend-svg .t-pt.r-W { fill: var(--win); } .trend-svg .t-pt.r-L { fill: var(--loss); }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
  .lg::before { content: ""; display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; background: var(--accent); }
  .lg.l-avg::before { background: var(--text); opacity: .5; }
  .lg.l-w::before { width: 8px; height: 8px; border-radius: 50%; background: var(--win); }
  .lg.l-l::before { width: 8px; height: 8px; border-radius: 50%; background: var(--loss); }

  /* ---------- highlights ---------- */
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--card-bg); }
  .seg button { border: 0; background: none; color: var(--muted); padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--accent-soft); color: var(--accent-2); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--card-bg); padding: 4px 11px; border-radius: 999px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
  .chip:hover { color: var(--text); border-color: var(--line-2); }
  .chip.on { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: var(--accent-soft); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .clip { display: flex; flex-direction: column; align-self: start; text-align: left; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
    background: var(--card-bg); cursor: pointer; min-width: 0; transition: border-color .15s, transform .2s, box-shadow .2s; animation: rise .45s cubic-bezier(.2,.7,.2,1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .clip:hover, .clip:focus-visible { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); transform: translateY(-2px);
    box-shadow: 0 16px 36px -18px color-mix(in srgb, var(--accent) 55%, #000); outline: none; }
  .thumb { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: var(--panel-2); }
  .thumb img, .thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .thumb.vertical img, .thumb.vertical video { object-fit: contain; }
  .thumb.vertical .blur { position: absolute; inset: -20px; background: center / cover; filter: blur(18px) brightness(.55); }
  .thumb video { opacity: 0; transition: opacity .25s; }
  .thumb video.ready { opacity: 1; }
  .thumb::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,.35), transparent 30%, transparent 65%, rgba(0,0,0,.5)); }
  .badge { position: absolute; z-index: 2; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px;
    background: rgba(6, 8, 10, .74); backdrop-filter: blur(6px); font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #fff; }
  .badge.map { top: 8px; left: 8px; }
  .badge.map i { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--accent)); box-shadow: 0 0 8px var(--c, var(--accent)); }
  .badge.kills { top: 8px; right: 8px; color: var(--accent-ink); background: var(--accent); }

  }
  function clutchCard(s) {
    const won = s.cl.reduce((a, c) => a + c[0], 0), played = s.cl.reduce((a, c) => a + c[1], 0);
    return card('Clutches', [
      big(`${pct(won, played)}`, '%', `${won} won of ${played}`),
      barList(s.cl.map(([w, p], i) => ({ label: `1v${i + 1}`, note: `${w}/${p}`, value: p ? `${pct(w, p)}%` : '—', frac: p ? w / p : 0 })))]);
  }
  function entryCard(s) {
    const [fk, fd, tfk, tfd, cfk, cfd] = s.op;
    const row = (label, k, d, cls) => ({ label, note: `${k}–${d}`, value: `${pct(k, k + d)}%`, frac: k + d ? k / (k + d) : 0, fillCls: cls });
    return card('Opening duels', [
      big(`${pct(fk, fk + fd)}`, '%', `won${s.r ? ` · in ${pct(fk + fd, s.r)}% of rounds` : ''}`),
      barList([row('T side', tfk, tfd, 't'), row('CT side', cfk, cfd, 'ct')])]);
  }
  function mapsCard(s) {
    if (!s.mp.length) return null;
    return card('Maps', h('div', { class: 'map-rows' }, ...s.mp.map(([m, played, won]) => {
      const wr = pct(won, played);
      return h('div', { class: 'map-row', title: `${won} won of ${played}` }, mapThumb(m),
        h('div', { class: 'map-row-main' },
          h('div', { class: 'bar-top' }, h('span', { class: 'bar-label' }, mapName(m)), h('span', { class: 'spacer' }), h('span', { class: 'bar-note' }, `${played} played`), h('b', { class: wr >= 50 ? 'good' : 'bad' }, `${wr}%`)),
          h('div', { class: 'bar-track' }, h('div', { class: `bar-fill ${wr >= 50 ? 'good' : 'bad'}`, style: { width: `${wr}%` } }))));
    })), { span: 2 });
  }

  // ---------- page ----------
  const section = (title, extra, ...body) => h('section', { class: 'ov-sec' }, h('div', { class: 'sec' }, h('h3', {}, title), extra), ...body);
  function render() {
    const s = G.stats, items = G.items;
    const name = G.name || 'CS2 player';
    document.title = `${name} · CS2 highlights`;
    const letter = h('div', { class: 'avatar' }, name[0].toUpperCase());
    const avatar = G.avatar ? h('div', { class: 'avatar' }, h('img', { src: G.avatar, alt: '', onerror: () => avatar.replaceWith(letter) })) : letter;
    const head = h('div', { class: 'dash-head' },
      avatar,
      h('div', { class: 'dash-title' },
        h('div', { class: 'kicker' }, 'CS2 highlights'),
        h('h1', {}, name),
        h('div', { class: 'sub' }, [
          s ? `${fmtNum(s.n)} match${s.n === 1 ? '' : 'es'} · ${fmtNum(s.r)} rounds` : null,
          `${items.length} highlight${items.length === 1 ? '' : 's'}`,
        ].filter(Boolean).join(' · '))),
      h('span', { class: 'spacer' }),
      h('div', { class: 'head-actions' },
        G.steamid ? h('a', { class: 'btn', href: `https://steamcommunity.com/profiles/${G.steamid}`, target: '_blank', rel: 'noopener noreferrer' }, svg(ICON.steam), 'Steam profile') : null,
        h('button', { class: 'btn primary', onclick: () => copy(pageLink()) }, svg(ICON.link), 'Copy link')));

    const top = s ? h('div', { class: 'ov-top' },
      scorePanel(s),
      h('div', { class: 'ov-stats' },
        h('div', { class: 'sec' }, h('h3', {}, 'Stats overview'),
          h('span', { class: 'hint legend-inline' }, h('i', { class: 'lg-avg' }), `all ${fmtNum(s.n)} matches`, s.t10 ? [h('i', { class: 'lg-rec' }), 'last 10'] : null)),
        h('div', { class: 'tiles' }, ...TILES.map((d, i) => tile(d, s.ti[i] ?? null, s.t10?.[i] ?? null, s.hg[i]))))) : null;

    const maps = [...new Set(items.filter(x => x.map && !x.montage).map(x => x.map))];
    const shown = items.filter(x => state.map === 'all' || x.map === state.map)
      .sort(state.sort === 'best' ? (a, b) => b.score - a.score || b.kills - a.kills || a.n - b.n : (a, b) => a.n - b.n);
    const controls = h('div', { style: { display: 'flex', gap: '10px', flexWrap: 'wrap', alignItems: 'center' } },
      maps.length > 1 ? h('div', { class: 'chips' },
        h('button', { class: `chip ${state.map === 'all' ? 'on' : ''}`, onclick: () => { state.map = 'all'; render(); } }, 'All maps'),
        ...maps.map(m => h('button', { class: `chip ${state.map === m ? 'on' : ''}`, onclick: () => { state.map = m; render(); } }, mapName(m)))) : null,
      shown.length > 1 ? h('button', { class: 'btn', onclick: () => open(shown, 0) }, svg(ICON.play), 'Play all') : null,
      h('div', { class: 'seg' }, ...[['latest', 'Latest'], ['best', 'Best']].map(([k, l]) =>
        h('button', { class: state.sort === k ? 'on' : '', onclick: () => { state.sort = k; render(); } }, l))));
    const highlights = section(`Highlights · ${shown.length}`, controls, h('div', { class: 'grid' }, ...shown.map((x, i) => clipCard(x, i, shown))));

    const form = s ? section('Recent form', null, h('div', { class: 'dash' }, trendCard(s), multiCard(s))) : null;
    const duels = s ? section('Rounds & maps', null, h('div', { class: 'dash' }, clutchCard(s), entryCard(s), mapsCard(s))) : null;
    const footer = h('footer', {},
      h('span', {}, s ? 'Stats from this player’s own demos. ' : null, 'Videos are hosted on ', h('a', { href: 'https://qu.ax', target: '_blank', rel: 'noopener' }, 'qu.ax'), ' and ', h('a', { href: 'https://catbox.moe', target: '_blank', rel: 'noopener' }, 'catbox.moe'), ': if they don’t load, your internet provider may block them (switching your DNS to 1.1.1.1 usually fixes that).'),
      h('a', { href: GITHUB, target: '_blank', rel: 'noopener' }, 'Made with CS2 DemoLab, free'));
    app.replaceChildren(...[hero(head), top, highlights, form, duels, footer].filter(Boolean)); // (null would show as text)
  }

  // The featured clip (picked in the app, else the best one) playing silently behind the name, like a
  // profile banner. Phones and data savers get its picture instead of the video.
  function hero(head) {
    const items = G.items;
    // (a montage's score is the sum of its clips': only featured when picked, or when there is nothing else)
    const x = G.featured || [...items].sort((a, b) => a.montage - b.montage || b.score - a.score || b.kills - a.kills)[0];
    if (!x) return head;
    const light = matchMedia('(max-width: 720px), (prefers-reduced-motion: reduce)').matches || navigator.connection?.saveData;
    const pic = x.thumb ? fileUrl(x.thumb) : null;
    let media;
    if (light || !pic) media = pic ? h('img', { class: `hero-media ${x.vertical ? 'vertical' : ''}`, src: pic, alt: '' }) : null;
    else {
      media = h('video', { class: `hero-media ${x.vertical ? 'vertical' : ''}`, src: fileUrl(x.video), poster: pic, muted: true, autoplay: true, loop: true, playsinline: true, preload: 'auto' });
      media.muted = true;
      media.addEventListener('playing', () => media.classList.add('ready'), { once: true });
    }
    const list = items;
    return h('section', { class: 'hero' }, media,
      h('div', { class: 'hero-feat' },
        h('span', { class: 'hero-chip' }, svg(ICON.star), 'Featured'),
        h('span', { class: 'hero-title' }, x.title, h('small', {}, [x.montage ? 'Montage' : mapName(x.map), x.weapon].filter(Boolean).join(' · '))),
        h('button', { class: 'btn hero-watch', onclick: () => open(list, list.indexOf(x)) }, svg(ICON.play), 'Watch')),
      head);
  }

  function clipCard(x, i, list) {
    const pic = x.thumb ? fileUrl(x.thumb) : '';
    const thumb = h('div', { class: `thumb ${x.vertical ? 'vertical' : ''}` },
      x.vertical && pic ? h('div', { class: 'blur', style: { backgroundImage: `url("${pic}")` } }) : null,
      pic ? h('img', { src: pic, alt: '', loading: 'lazy', decoding: 'async' }) : null,
      x.montage ? h('span', { class: 'badge map' }, h('i'), 'Montage') : x.map ? h('span', { class: 'badge map', style: { '--c': mapColor(x.map) } }, h('i'), mapName(x.map)) : null,
      !x.montage && killBadge(x) ? h('span', { class: `badge kills ${isAce(x) ? 'ace' : ''}` }, killBadge(x)) : null,
      h('span', { class: 'badge dur' }, fmtDur(x.dur)),
      h('span', { class: 'play' }, svg(ICON.play)));
    let timer = null, video = null;
    const stop = () => { clearTimeout(timer); video?.remove(); video = null; el.classList.remove('previewing'); };
    const el = h('button', {
      class: 'clip', style: { animationDelay: `${Math.min(i, 12) * 35}ms` }, 'aria-label': `Play ${x.title}`,
      onclick: () => { stop(); open(list, i); },
      onmouseenter: () => {
        if (!matchMedia('(hover: hover)').matches) return;
        timer = setTimeout(() => {
          video = h('video', { src: fileUrl(x.video), muted: true, autoplay: true, loop: true, playsinline: true, preload: 'auto' });
          video.muted = true;
          video.addEventListener('playing', () => { video?.classList.add('ready'); el.classList.add('previewing'); }, { once: true });
          thumb.insertBefore(video, thumb.querySelector('.badge'));
        }, 280);
      },
      onmouseleave: stop,
    }, thumb, h('div', { class: 'clip-body' },
      h('div', { class: 'clip-title', title: x.title }, x.title), metaEl(x),
      ctxEl(x),
      x.tags.length ? h('div', { class: 'tags' }, ...x.tags.map(t => h('span', { class: 'tag' }, t))) : null));
    return el;
  }

  // ---------- player ----------
  let lb = null, cur = null;
  function close() {
    lb?.remove(); lb = null; cur = null;
    history.replaceState(null, '', `#${code}`);
  }
  document.addEventListener('keydown', e => {
    if (!cur || (e.target.tagName === 'VIDEO' && e.key.startsWith('Arrow'))) return; // a focused video seeks with the arrows
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft' && cur.i > 0) open(cur.list, cur.i - 1);
    else if (e.key === 'ArrowRight' && cur.i + 1 < cur.list.length) open(cur.list, cur.i + 1);
  });
  function open(list, i) {
    const x = list[i];
    lb?.remove();
    cur = { list, i };
    history.replaceState(null, '', `#${code}!${x.n}`);
    const video = h('video', { src: fileUrl(x.video), controls: true, autoplay: true, playsinline: true, poster: x.thumb ? fileUrl(x.thumb) : null });
    try { video.volume = clamp(Number(localStorage.getItem('vol') ?? 0.6), 0, 1); } catch {}
    video.addEventListener('volumechange', () => { try { localStorage.setItem('vol', video.volume); } catch {} });
    video.addEventListener('ended', () => { if (i + 1 < list.length) open(list, i + 1); });
    video.addEventListener('error', () => video.replaceWith(h('div', { class: 'vid-error' },
      h('b', {}, 'This video won’t load'),
      x.video.startsWith('q/') ? 'It is on qu.ax, which did not send it. Try again later; if it keeps failing, switching your DNS to 1.1.1.1 (or a VPN) may help.' : 'It is on files.catbox.moe, which some internet providers block. Switching your DNS to 1.1.1.1 (or a VPN) usually fixes it. Catbox also removes clips nobody watched for 2 years.')));
    // The kills: markers on a line as wide as the video, and one chip each; both jump just before the kill.
    const seek = t => { video.currentTime = Math.max(0, t - 1.5); video.play().catch(() => {}); };
    const fmtT = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
    const killText = k => [k.w, k.v ? `→ ${k.v}` : null, k.p ? `(${k.p})` : null].filter(Boolean).join(' ');
    const marks = x.kl.map((k, n) => h('button', { class: 'kmark', style: { left: `${clamp(k.t / (x.dur || 1), 0, 1) * 100}%` }, title: `${fmtT(k.t)} · ${killText(k)}${k.f.length ? ` · ${k.f.join(', ')}` : ''}`, onclick: () => seek(k.t) }, n + 1));
    const chips = x.kl.map((k, n) => h('button', { class: 'kchip', onclick: () => seek(k.t) },
      h('time', {}, fmtT(k.t)), h('b', {}, k.w), k.v ? h('span', {}, '→ ', k.v) : null, k.p ? h('i', {}, k.p) : null, ...k.f.map(t => h('em', {}, t === 'Headshot' ? 'HS' : t))));
    const prog = h('div', { class: 'prog' });
    const killbar = x.kl.length ? h('div', { class: 'killbar' }, prog, ...marks) : null;
    const fit = () => { if (killbar && video.clientWidth) killbar.style.width = `${video.clientWidth}px`; };
    video.addEventListener('timeupdate', () => {
      const t = video.currentTime;
      prog.style.width = `${clamp(t / (video.duration || x.dur || 1), 0, 1) * 100}%`;
      x.kl.forEach((k, n) => { marks[n].classList.toggle('done', t >= k.t); chips[n].classList.toggle('done', t >= k.t); });
    });
    lb = h('div', { class: 'lightbox', role: 'dialog', 'aria-label': x.title, onclick: e => { if (e.target === lb || e.target.classList.contains('stage')) close(); } },
      h('div', { class: 'lb-head' },
        h('div', { class: 'lb-title' }, h('h2', {}, x.title), metaEl(x)),
        h('button', { class: 'btn', title: 'A link to this page that opens this clip', onclick: () => copy(pageLink(x.n)) }, svg(ICON.link), h('span', {}, 'Copy clip link')),
        h('button', { class: 'btn', title: 'The video file itself: Discord and most chats play it right in the conversation', onclick: () => copy(x.video.startsWith('q/') ? `https://qu.ax/${x.video.slice(2, -4)}` : fileUrl(x.video), 'Video link copied: Discord plays it right in the chat') }, svg(ICON.video), h('span', {}, 'Copy video link')),
        h('a', { class: 'icon-btn', href: fileUrl(x.video), target: '_blank', rel: 'noopener', title: 'Open the video file' }, svg(ICON.download)),
        h('button', { class: 'icon-btn', title: 'Close (Esc)', onclick: close }, svg(ICON.close))),
      h('div', { class: 'stage' }, video, killbar,
        h('button', { class: 'nav prev', title: 'Previous (←)', hidden: i === 0, onclick: () => open(list, i - 1) }, svg(ICON.left)),
        h('button', { class: 'nav next', title: 'Next (→)', hidden: i + 1 >= list.length, onclick: () => open(list, i + 1) }, svg(ICON.right))),
      h('div', { class: 'lb-foot' },
        chips.length ? h('div', { class: 'kills' }, ...chips) : null,
        ctxEl(x, true),
        x.tags.length ? h('div', { class: 'tags' }, ...x.tags.map(t => h('span', { class: 'tag' }, t))) : null,
        h('span', {}, `${i + 1} / ${list.length}`)));
    document.body.append(lb);
    if (killbar) new ResizeObserver(fit).observe(video);
  }

  function empty(title, text) {
    document.title = 'CS2 highlights';
    applyTheme(null);
    app.replaceChildren(h('div', { class: 'empty' },
      h('div', { class: 'ico' }, svg(ICON.film)), h('h1', {}, title), h('p', {}, text),
      h('p', {}, h('a', { class: 'btn primary', href: GITHUB, target: '_blank', rel: 'noopener' }, 'Get CS2 DemoLab'))));
  }

  async function load() {
    const [c, pick] = location.hash.slice(1).split('!');
    if (c === code && G) return;
    if (!c) return empty('CS2 highlights', 'Share your best CS2 plays and your stats with one link: CS2 DemoLab records them from your demos and makes this page for you.');
    try {
      // A short link names the page's data on catbox (6 letters and digits); a long one carries it.
      G = clean(/^[a-z0-9]{6}$/.test(c) ? await fetchData(c) : await inflate(c));
      code = c;
    } catch {
      return empty('This link is broken', /^[a-z0-9]{6}$/.test(c) ? 'Its page could not be loaded from catbox.moe. Some internet providers block it: switching your DNS to 1.1.1.1 usually fixes that. Or ask for the link again.' : 'Part of the link is probably missing. Ask for it again, and copy it whole.');
    }
    applyTheme(G.theme);
    if (!G.items.length) return empty('No clips here yet', 'This highlights page is empty.');
    render();
    const n = Number(pick);
    if (pick !== undefined && G.items[n]) open(G.items, n);
  }
  window.addEventListener('hashchange', () => { if (!lb) load(); });
  load();
})();
</script>
</body>
</html>
